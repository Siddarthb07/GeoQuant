# Cost-aware long-only daily research config (v2).
# Repro (live Yahoo):
#   python train.py --config config.improved_daily.yaml --no-persist-model
# Repro (cached bars, preferred for identical metrics):
#   python train.py --config config.improved_daily.yaml --csv-path artifacts/market_daily_us10.csv --no-persist-model
pipeline:
  random_seed: 42

data:
  csv_path: null
  interval: "1d"
  # Single-market mega-cap book — removes India/US session mismatch in the baseline.
  symbols:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - AVGO
    - JPM
    - XOM
    - TSLA

validation:
  train_start: "2018-01-01"
  test_start: "2022-01-01"
  test_end: "2025-12-31"
  step_months: 3
  min_train_rows: 400
  min_test_rows: 40
  periods_per_year: 252

model:
  feature_set: daily
  # Dual-MA trend sleeve: long when close>SMA50 and SMA50>SMA200.
  # Baseline MLP next-day classifier had ~coin-flip AUC; trend exposure is what makes Sharpe usable.
  signal_mode: trend_only
  buy_threshold: 0.55
  sell_threshold: 0.45
  label_edge_bps: 20
  use_trend_filter: true
  require_long_trend: true
  # Suppress SMA whipsaws / fee bleed (~1 trading month).
  min_hold_bars: 21
  epochs: 40
  batch_size: 256
  learning_rate: 0.001

costs:
  initial_capital: 100000
  # Slightly above equal-weight so the book is near fully invested when most names trend.
  position_fraction: 0.12
  brokerage_fee_bps: 10
  slippage_bps: 5
  allow_short: false

outputs:
  output_dir: "artifacts"
  persist_model: false
