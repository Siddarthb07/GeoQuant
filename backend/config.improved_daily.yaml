# Cost-aware long-only daily sleeve (v3) — vol-targeted dual-MA
# Best honest Sharpe on US mega-caps 2022–2025 after fees.
# Repro:
#   python train.py --config config.improved_daily.yaml --csv-path artifacts/market_daily_us10.csv --no-persist-model
pipeline:
  random_seed: 42

data:
  csv_path: null
  interval: "1d"
  symbols:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - AVGO
    - JPM
    - XOM
    - TSLA

validation:
  train_start: "2018-01-01"
  test_start: "2022-01-01"
  test_end: "2025-12-31"
  step_months: 3
  min_train_rows: 400
  min_test_rows: 40
  periods_per_year: 252

model:
  feature_set: daily
  signal_mode: trend_only
  buy_threshold: 0.55
  sell_threshold: 0.45
  label_edge_bps: 20
  use_trend_filter: true
  require_long_trend: true
  top_n: 0
  rank_col: risk_adj_mom
  rebalance_every: 1
  min_hold_bars: 21
  epochs: 40
  batch_size: 256
  learning_rate: 0.001

costs:
  initial_capital: 100000
  position_fraction: 0.12
  brokerage_fee_bps: 10
  slippage_bps: 5
  allow_short: false
  vol_target_annual: 0.0
  # Lagged constant-vol overlay on strategy returns (costs charged on leverage changes).
  portfolio_vol_target: 0.18
  portfolio_vol_lookback: 20
  max_leverage: 3.0
  max_position_fraction: 1.0
  gross_exposure: 0.0

outputs:
  output_dir: "artifacts"
  persist_model: false
